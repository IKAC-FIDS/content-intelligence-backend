services:
  restore-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: iam_crm_restore
      POSTGRES_PASSWORD: restore_test_only_not_for_deployment
      POSTGRES_DB: iam_crm_restore_test
    volumes:
      - restore_db_data:/var/lib/postgresql/data

  restore-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: restoretest
      MINIO_ROOT_PASSWORD: restore_test_only_not_for_deployment
    volumes:
      - restore_minio_data:/data

volumes:
  restore_db_data:
  restore_minio_data:
